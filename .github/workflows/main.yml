# GitHub is authoritative: mirror latest main on main pushes, release-tag pushes,
# or manual dispatch. An optional tag is copied without rewinding main to it.
# This copies Git refs only; GitLab's CI rules decide which pipelines run.
# Required Actions secrets:
#   GITLAB_HOST: public bare hostname behind Cloudflare Access (not internal DNS)
#   GITLAB_PROJECT_PATH: group/project, no leading slash or .git suffix
#   GITLAB_PUSH_TOKEN: project access token, Developer + write_repository
#     (not a deploy token; deploy tokens cannot push repository code)
#   CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET: Access service token with a
#     Service Auth policy on the public GitLab application.
name: Mirror to GitLab

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing release tag; leave empty to sync main only'
        required: false
        default: ''
        type: string

# All runs update the same destination branch. A queued run checks out the
# latest main when it starts, not an old event commit or the release tag.
# Queue up to 100 runs so a main push does not replace a waiting release-tag run.
concurrency:
  group: mirror-gitlab
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror main and optional release tag to GitLab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest main with full history and tags
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate required secrets and optional tag
        env:
          GITLAB_HOST: ${{ secrets.GITLAB_HOST }}
          GITLAB_PROJECT_PATH: ${{ secrets.GITLAB_PROJECT_PATH }}
          GITLAB_PUSH_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          for key in GITLAB_HOST GITLAB_PROJECT_PATH GITLAB_PUSH_TOKEN CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required Actions secret: $key"
              exit 1
            fi
          done
          if [[ ! "$GITLAB_HOST" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]]; then
            echo "::error::GITLAB_HOST must be a bare public DNS hostname, without scheme, port or path."
            exit 1
          fi
          if [[ ! "$GITLAB_PROJECT_PATH" =~ ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$ ]] || [[ "$GITLAB_PROJECT_PATH" == *.git ]]; then
            echo "::error::GITLAB_PROJECT_PATH must be group/project with no leading slash or .git suffix."
            exit 1
          fi
          getent hosts "$GITLAB_HOST" >/dev/null || { echo "::error::GITLAB_HOST must resolve from the GitHub-hosted runner; use the public Cloudflare Access hostname."; exit 1; }
          if [ -n "$TAG" ]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Optional tag must match vX.Y.Z."; exit 1; }
            git check-ref-format "refs/tags/$TAG"
            git show-ref --verify --quiet "refs/tags/$TAG" || { echo "::error::Requested release tag does not exist in this checkout."; exit 1; }
          fi

      - name: Push latest main and optional tag through Cloudflare Access
        env:
          GITLAB_HOST: ${{ secrets.GITLAB_HOST }}
          GITLAB_PROJECT_PATH: ${{ secrets.GITLAB_PROJECT_PATH }}
          GITLAB_PUSH_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          REMOTE_URL="https://${GITLAB_HOST}/${GITLAB_PROJECT_PATH}.git"
          git remote add gitlab "$REMOTE_URL"
          # Scope credentials to this repository URL. Never follow redirects
          # with custom Access headers, and remove local credentials on exit.
          cleanup() {
            git config --local --unset-all "http.${REMOTE_URL}.extraHeader" || true
            git remote remove gitlab || true
          }
          trap cleanup EXIT
          git config --local http.followRedirects false
          AUTH=$(printf 'gitlab-ci-token:%s' "$GITLAB_PUSH_TOKEN" | base64 -w 0)
          echo "::add-mask::$AUTH"
          git config --local "http.${REMOTE_URL}.extraHeader" "Authorization: Basic ${AUTH}"
          git config --local --add "http.${REMOTE_URL}.extraHeader" "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
          git config --local --add "http.${REMOTE_URL}.extraHeader" "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
          code=$(curl --silent --show-error --connect-timeout 15 --max-time 45 -o /dev/null -w '%{http_code}' \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "https://${GITLAB_HOST}/api/v4/version")
          case "$code" in
            200|401) echo "Cloudflare Access passed; GitLab responded." ;;
            302|403) echo "::error::Cloudflare Access rejected or redirected the request; check the service token and Service Auth policy."; exit 1 ;;
            *) echo "::error::Unexpected HTTP $code from GitLab access check; not pushing."; exit 1 ;;
          esac
          # Force only main: this is an authoritative one-way mirror. Never
          # force existing tags, delete refs, or touch GitLab-only CI branches.
          refspecs=("+HEAD:refs/heads/main")
          if [ -n "$TAG" ]; then
            refspecs+=("refs/tags/$TAG:refs/tags/$TAG")
          fi
          git push --atomic gitlab "${refspecs[@]}"
          expected=$(git rev-parse HEAD)
          actual=$(git ls-remote gitlab refs/heads/main | cut -f1)
          [ "$expected" = "$actual" ] || { echo "::error::GitLab main does not match the pushed commit."; exit 1; }
          {
            echo "### Mirror complete"
            echo "- Main commit: $expected"
            if [ -n "$TAG" ]; then echo "- Release tag: $TAG"; fi
            echo "- GitLab project: https://${GITLAB_HOST}/${GITLAB_PROJECT_PATH}"
            echo "- Pipelines (subject to GitLab CI rules): https://${GITLAB_HOST}/${GITLAB_PROJECT_PATH}/-/pipelines"
          } >> "$GITHUB_STEP_SUMMARY"

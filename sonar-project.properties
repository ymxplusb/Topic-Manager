sonar.projectKey=topic-manager
sonar.projectName=Topic Manager
# THE WHOLE TREE, because that is what the release scan reads. The tag
# pipeline (ci-templates v1.5.3) passes -Dsonar.sources=. and a -D property
# overrides this file, so the "tm,app/components" that stood here until
# v1.2.0 described a scan nobody ran: the gate that fails a release reads
# install/, tools/, tests/, nginx/, systemd/ and every other tracked file of a
# language SonarQube knows. tools/sonar-local.sh runs the same scan before the
# tag. The exclusions below DO apply in CI (nothing on the command line
# replaces them): tools/lib/ and tests/lib/, bytecode caches, and the
# stylesheet.
sonar.sources=.
sonar.exclusions=**/lib/**,**/__pycache__/**,app/styles/**
sonar.python.version=3.12

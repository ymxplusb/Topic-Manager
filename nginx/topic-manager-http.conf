# Jarvis Topic Manager — the HTTP (:80) listener: a permanent redirect to HTTPS.
# Place at /etc/nginx/sites-available/topic-manager-http
# Copyright (c) 2025-2026 James Rodman. All Rights Reserved.
#
# v1.2.0 (NGNX-APP-000510): its own site, so Settings > Security > HTTP
# redirect switches the :80 listener on and off with ONE symlink,
#   /etc/nginx/sites-enabled/topic-manager-http,
# made or removed by the root apply helper (tm-apply nginx), which also opens
# or closes ufw 80/tcp to match. With it off, nothing listens on port 80.
# install.sh sets server_name from --server-name, as for the main site.

server {
    listen 80;
    server_name YOUR-HOSTNAME.YOUR-DOMAIN.com _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# Jarvis Topic Manager — the DoD access-log format (v1.3.0, NGNX-APP-000240).
# Place at /etc/nginx/conf.d/topic-manager-log-format.conf (http context).
# Copyright (c) 2025-2026 James Rodman. All Rights Reserved.
#
# A release file: install.sh and every upgrade lay it down as shipped. The
# Topic Manager sites log in this format (access_log ... tm_dod), and so does
# the syslog copy Settings > Logging > Remote syslog renders. Every field the
# STIG names for an access record is here: $server_name $server_addr
# $remote_addr $remote_user $time_local $status $request $request_id
# $http_user_agent $http_x_forwarded_for. $remote_user is always "-": sign-in
# belongs to the application, and its audit trail records the user.
log_format tm_dod '$time_local $server_name $server_addr $remote_addr $remote_user '
                  '"$request" $status $body_bytes_sent "$http_user_agent" '
                  '"$http_x_forwarded_for" $request_id';

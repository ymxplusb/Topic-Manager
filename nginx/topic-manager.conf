# Jarvis Topic Manager — nginx site configuration
# Place at /etc/nginx/sites-available/topic-manager
# Enable: ln -s /etc/nginx/sites-available/topic-manager /etc/nginx/sites-enabled/
# Copyright (c) 2025-2026 James Rodman. All Rights Reserved.

server {
    listen 80;
    server_name topic-manager.int.crypticlight.com kafka-topics.int.crypticlight.com _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name topic-manager.int.crypticlight.com kafka-topics.int.crypticlight.com _;

    ssl_certificate     /etc/topic-manager/tls/server.crt;
    ssl_certificate_key /etc/topic-manager/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    root /var/www/topic-manager;
    index index.html;

    # Serve static frontend
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache static assets (libs, css, js components)
    location ~* \.(js|css)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Proxy API requests to gunicorn
    location /api/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    access_log /var/log/nginx/topic-manager-access.log;
    error_log  /var/log/nginx/topic-manager-error.log;
}

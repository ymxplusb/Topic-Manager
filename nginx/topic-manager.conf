# Jarvis Topic Manager — nginx site configuration
# Place at /etc/nginx/sites-available/topic-manager
# Enable: ln -s /etc/nginx/sites-available/topic-manager /etc/nginx/sites-enabled/
# Copyright (c) 2025-2026 James Rodman. All Rights Reserved.
#
# NOTE: Replace YOUR-HOSTNAME.YOUR-DOMAIN.com below with the actual FQDN
# for this server (e.g. kafka-topics.corp.example.com). The trailing _ is
# a catch-all and can be left in place — it ensures the site responds even
# if accessed by IP directly.

# Upstream with keepalive pool — avoids per-request TCP handshake to gunicorn.
# 16 keepalive connections shared across all nginx workers (sufficient for 15 users).
upstream tm_backend {
    server 127.0.0.1:5001;
    keepalive 16;
}

server {
    listen 80;
    server_name YOUR-HOSTNAME.YOUR-DOMAIN.com _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR-HOSTNAME.YOUR-DOMAIN.com _;

    ssl_certificate     /etc/topic-manager/tls/server.crt;
    ssl_certificate_key /etc/topic-manager/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:TM:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    # Keep browser connections alive — reduces per-tab reconnect overhead
    keepalive_timeout 65s;
    keepalive_requests 200;

    root /var/www/topic-manager;
    index index.html;

    # Serve static frontend — no-cache so updates deploy instantly
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache JS/CSS components for one day (cache-bust via ?v= token in index.html)
    location ~* \.(js|css)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Proxy API to gunicorn
    location /api/ {
        proxy_pass         http://tm_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";          # required for upstream keepalive
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Generous timeouts — Kafka AdminClient calls can take several seconds
        proxy_read_timeout    90s;
        proxy_connect_timeout 15s;
        proxy_send_timeout    30s;
        # Buffer responses so gunicorn workers are freed quickly
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
    }

    access_log /var/log/nginx/topic-manager-access.log;
    error_log  /var/log/nginx/topic-manager-error.log;
}

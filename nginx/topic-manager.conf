# Jarvis Topic Manager — nginx site configuration
# Place at /etc/nginx/sites-available/topic-manager
# Enable: ln -s /etc/nginx/sites-available/topic-manager /etc/nginx/sites-enabled/
# Copyright (c) 2025-2026 James Rodman. All Rights Reserved.
#
# NOTE: Replace YOUR-HOSTNAME.YOUR-DOMAIN.com below with the actual FQDN
# for this server (e.g. kafka-topics.corp.example.com). The trailing _ is
# a catch-all and can be left in place — it ensures the site responds even
# if accessed by IP directly.
#
# IMPORTANT: nginx cancels ALL parent add_header directives the moment a child
# location block defines its own add_header. Security headers must therefore
# be repeated via an include in every location that sets Cache-Control.
# Do NOT move security headers back to the server block alone.

upstream tm_backend {
    server 127.0.0.1:5001;
    keepalive 16;
}

server {
    listen 80;
    server_name YOUR-HOSTNAME.YOUR-DOMAIN.com _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR-HOSTNAME.YOUR-DOMAIN.com _;

    ssl_certificate     /etc/topic-manager/tls/server.crt;
    ssl_certificate_key /etc/topic-manager/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:TM:10m;
    ssl_session_timeout 10m;

    keepalive_timeout 65s;
    keepalive_requests 200;

    root /var/www/topic-manager;
    index index.html;

    # Serve static frontend — no-cache so updates deploy instantly.
    # Security headers included explicitly — see note at top of file.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/tm-security-headers.conf;
    }

    # Cache JS/CSS for one day (cache-busted via ?v= token in index.html).
    location ~* \.(js|css)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/tm-security-headers.conf;
    }

    # Proxy API to gunicorn
    location /api/ {
        proxy_pass         http://tm_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    90s;
        proxy_connect_timeout 15s;
        proxy_send_timeout    30s;
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
        include /etc/nginx/snippets/tm-security-headers.conf;
    }

    access_log /var/log/nginx/topic-manager-access.log;
    error_log  /var/log/nginx/topic-manager-error.log;
}

# Jarvis Topic Manager — nginx site configuration
# Place at /etc/nginx/sites-available/topic-manager
# Enable: ln -s /etc/nginx/sites-available/topic-manager /etc/nginx/sites-enabled/
# Copyright (c) 2025-2026 James Rodman. All Rights Reserved.
#
# NOTE: Replace YOUR-HOSTNAME.YOUR-DOMAIN.com below with the actual FQDN
# for this server (e.g. topics.example.org). install.sh does this for you from
# --server-name (default: this host's FQDN). The trailing _ is a catch-all and
# can be left in place — it ensures the site responds even if accessed by IP.
#
# TLS POLICY (v1.1.0) — FIPS 140-approved algorithms only, so the same file is
# correct on a STIG'd Ubuntu 24.04 host with FIPS mode enabled:
#   * TLS 1.2 and 1.3 only. The http-level ssl_protocols line in
#     /etc/nginx/nginx.conf is managed by install.sh and the upgrade too (stock
#     Ubuntu ships TLSv1 and TLSv1.1 there), backed up and nginx -t'd first.
#   * TLS 1.2: ECDHE key exchange with AES-GCM and SHA-256/384 only. No CBC,
#     no ChaCha20, no RSA key exchange, no SHA-1.
#   * TLS 1.3: the two AES-GCM suites, set explicitly so a host WITHOUT FIPS
#     mode does not offer ChaCha20-Poly1305 either.
#   * ECDHE curves P-256 and P-384 (X25519 is not FIPS-approved).
#   * Session tickets off (the ticket key never rotates across the life of the
#     worker), 15-minute session cache lifetime, no version in Server: or on
#     error pages.
#
# IMPORTANT: nginx cancels ALL parent add_header directives the moment a child
# location block defines its own add_header. Security headers must therefore
# be repeated via an include in every location that sets Cache-Control.
# Do NOT move security headers back to the server block alone.
#
# v1.2.0 — WHAT SETTINGS MANAGES, AND WHERE. This file is the release's and is
# replaced by every upgrade, so it holds NO operator choice. Everything
# Settings can change lives in files the root apply helper
# (/usr/libexec/topic-manager/tm-apply nginx|syslog) renders and this file
# only includes, which an upgrade keeps:
#   /etc/nginx/conf.d/topic-manager-limits.conf   limit_req/limit_conn zones (http)
#   /etc/nginx/snippets/tm-limits-server.conf     limit_conn per client address
#   /etc/nginx/snippets/tm-limits-login.conf      limit_req for POST /api/auth/login
#   /etc/nginx/snippets/tm-limits-api.conf        limit_req for the rest of /api/
#   /etc/nginx/snippets/tm-syslog.conf            nginx -> local syslog (forwarding)
#   /etc/nginx/sites-enabled/topic-manager-http   the :80 redirect, present or not
# and one release file, replaced by every upgrade like this one:
#   /etc/nginx/conf.d/topic-manager-log-format.conf   log_format tm_dod (http)
# The :80 server block is its own site (nginx/topic-manager-http.conf) so the
# redirect is switched on and off by one symlink, never by editing this file.

# v1.3.0 — THE ACCESS LOG FORMAT (NGNX-APP-000240, DQ5). Both logs below use
# log_format tm_dod, which carries every field the STIG names (nginx's default
# "combined" has no $server_name, $server_addr, $request_id or
# $http_x_forwarded_for). It is defined in the product's own http-level file,
# /etc/nginx/conf.d/topic-manager-log-format.conf (nginx/tm-log-format.conf):
# conf.d is read before sites-enabled, so every site may use it, and
# /etc/nginx/nginx.conf, the OS package's, is edited no further than v1.2.0
# edits it.

# v1.2.0: gunicorn has NO TCP port. It listens on a Unix socket that systemd
# creates 0660 topic-manager:www-data (systemd/topic-manager.socket), so nginx
# is the only thing besides the service account that can reach it: no local
# process can bypass the rate limits below or choose its own X-Forwarded-For.
upstream tm_backend {
    server unix:/run/topic-manager/gunicorn.sock;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name YOUR-HOSTNAME.YOUR-DOMAIN.com _;

    ssl_certificate     /etc/topic-manager/tls/server.crt;
    ssl_certificate_key /etc/topic-manager/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_conf_command    Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;
    ssl_ecdh_curve      secp384r1:prime256v1;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:TM:10m;
    ssl_session_timeout 15m;
    ssl_session_tickets off;
    server_tokens       off;

    keepalive_timeout 65s;
    keepalive_requests 200;

    # v1.2.0 (NGNX-APP-001030/001940): bounded client timeouts and body size.
    # 1m covers the largest request the application takes (a cluster profile
    # with its TLS material, a certificate upload of three PEM fields).
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    client_max_body_size  1m;

    # Rate and connection limits. The values are Settings > Security > Rate
    # limiting, rendered by the apply helper into the included snippets. A
    # limited request is a 429 with a JSON body (the sign-in page reads it),
    # never nginx's default 503.
    limit_req_status  429;
    limit_conn_status 429;
    include /etc/nginx/snippets/tm-limits-server.conf;

    root /var/www/topic-manager;
    index index.html;

    # v1.3.0 (NGNX-APP-001070): nginx's own error pages name nginx. These say
    # what happened and nothing about the server. error_page without "=" keeps
    # the original status code. A location that sets an error_page of its own
    # inherits NONE of these, so /api/ and the sign-in location repeat them.
    error_page 403 404 @tm_not_found;
    error_page 500 502 503 504 @tm_unavailable;

    location @tm_not_found {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/tm-security-headers.conf;
        return 200 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Not available</title></head><body><h1>Not available</h1><p>There is nothing to show at this address. Go to the <a href="/">Topic Manager home page</a>.</p></body></html>';
    }

    # JSON, because only the proxied API reaches it: the static pages need no
    # backend. An answer the APPLICATION gives (its own 502, 503) is passed
    # through untouched; this is for nginx's own, e.g. the service stopped.
    location @tm_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/tm-security-headers.conf;
        return 200 '{"error":"Topic Manager is not answering. Try again in a minute; if it persists, an administrator should check the service on the host.","code":"unavailable"}';
    }

    # Serve static frontend — no-cache so updates deploy instantly.
    # Security headers included explicitly — see note at top of file.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/tm-security-headers.conf;
    }

    # Cache JS/CSS for one day (cache-busted via ?v= token in index.html).
    location ~* \.(js|css)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/tm-security-headers.conf;
    }

    # A request refused by limit_req/limit_conn. JSON, because every caller
    # of /api/ parses JSON, and a distinct "code" so it cannot be mistaken for
    # the application's own 429 (the concurrent-session limit).
    location @tm_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        include /etc/nginx/snippets/tm-security-headers.conf;
        return 429 '{"error":"Too many requests from this address. Wait a minute and try again.","code":"rate_limited"}';
    }

    # Sign-in: its own, tighter limit (brute-force control). An exact-match
    # location wins over /api/ below, so it repeats EVERY proxy_set_header of
    # that block (X-Forwarded-Host above all: the backend trusts it) and the
    # security-header snippet — nginx inherits neither into a new location.
    location = /api/auth/login {
        include /etc/nginx/snippets/tm-limits-login.conf;
        error_page 429 = @tm_rate_limited;
        error_page 403 404 @tm_not_found;
        error_page 500 502 503 504 @tm_unavailable;
        proxy_pass         http://tm_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_read_timeout    90s;
        proxy_connect_timeout 15s;
        proxy_send_timeout    30s;
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
        include /etc/nginx/snippets/tm-security-headers.conf;
    }

    # Proxy API to gunicorn
    location /api/ {
        include /etc/nginx/snippets/tm-limits-api.conf;
        error_page 429 = @tm_rate_limited;
        error_page 403 404 @tm_not_found;
        error_page 500 502 503 504 @tm_unavailable;
        # The whole body in memory, never in nginx's temp directory: the TLS
        # certificate upload carries a private key (v1.2.0).
        client_body_buffer_size 1m;
        proxy_pass         http://tm_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Set here, unconditionally, because the backend TRUSTS it (ProxyFix
        # x_host=1 in tm/app.py). A header the trusted hop does not set is a
        # header the client sets, and this one would then decide request.host.
        proxy_set_header   X-Forwarded-Host $host;
        proxy_read_timeout    90s;
        proxy_connect_timeout 15s;
        proxy_send_timeout    30s;
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
        include /etc/nginx/snippets/tm-security-headers.conf;
    }

    # Both logs are the product's own (NGNX-APP-000400): install.sh and the
    # upgrade create them 0640 www-data:adm before nginx can create them
    # world-readable, and Ubuntu's /etc/logrotate.d/nginx recreates them the
    # same way at every rotation.
    access_log /var/log/nginx/topic-manager-access.log tm_dod;
    error_log  /var/log/nginx/topic-manager-error.log;
    # Settings > Logging > Remote syslog: the same logs to the local syslog
    # socket for forwarding, when it is on. Empty when it is off.
    include /etc/nginx/snippets/tm-syslog.conf;
}

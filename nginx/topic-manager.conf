# Jarvis Topic Manager — nginx site configuration
# Place at /etc/nginx/sites-available/topic-manager
# Enable: ln -s /etc/nginx/sites-available/topic-manager /etc/nginx/sites-enabled/
# Copyright (c) 2025-2026 James Rodman. All Rights Reserved.
#
# NOTE: Replace YOUR-HOSTNAME.YOUR-DOMAIN.com below with the actual FQDN
# for this server (e.g. topics.example.org). install.sh does this for you from
# --server-name (default: this host's FQDN). The trailing _ is a catch-all and
# can be left in place — it ensures the site responds even if accessed by IP.
#
# TLS POLICY (v1.1.0) — FIPS 140-approved algorithms only, so the same file is
# correct on a STIG'd Ubuntu 24.04 host with FIPS mode enabled:
#   * TLS 1.2 and 1.3 only. The http-level ssl_protocols line in
#     /etc/nginx/nginx.conf is managed by install.sh and the upgrade too (stock
#     Ubuntu ships TLSv1 and TLSv1.1 there), backed up and nginx -t'd first.
#   * TLS 1.2: ECDHE key exchange with AES-GCM and SHA-256/384 only. No CBC,
#     no ChaCha20, no RSA key exchange, no SHA-1.
#   * TLS 1.3: the two AES-GCM suites, set explicitly so a host WITHOUT FIPS
#     mode does not offer ChaCha20-Poly1305 either.
#   * ECDHE curves P-256 and P-384 (X25519 is not FIPS-approved).
#   * Session tickets off (the ticket key never rotates across the life of the
#     worker), 15-minute session cache lifetime, no version in Server: or on
#     error pages.
#
# IMPORTANT: nginx cancels ALL parent add_header directives the moment a child
# location block defines its own add_header. Security headers must therefore
# be repeated via an include in every location that sets Cache-Control.
# Do NOT move security headers back to the server block alone.

upstream tm_backend {
    server 127.0.0.1:5001;
    keepalive 16;
}

server {
    listen 80;
    server_name YOUR-HOSTNAME.YOUR-DOMAIN.com _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR-HOSTNAME.YOUR-DOMAIN.com _;

    ssl_certificate     /etc/topic-manager/tls/server.crt;
    ssl_certificate_key /etc/topic-manager/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_conf_command    Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;
    ssl_ecdh_curve      secp384r1:prime256v1;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:TM:10m;
    ssl_session_timeout 15m;
    ssl_session_tickets off;
    server_tokens       off;

    keepalive_timeout 65s;
    keepalive_requests 200;

    root /var/www/topic-manager;
    index index.html;

    # Serve static frontend — no-cache so updates deploy instantly.
    # Security headers included explicitly — see note at top of file.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/tm-security-headers.conf;
    }

    # Cache JS/CSS for one day (cache-busted via ?v= token in index.html).
    location ~* \.(js|css)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/tm-security-headers.conf;
    }

    # Proxy API to gunicorn
    location /api/ {
        proxy_pass         http://tm_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Set here, unconditionally, because the backend TRUSTS it (ProxyFix
        # x_host=1 in tm/app.py). A header the trusted hop does not set is a
        # header the client sets, and this one would then decide request.host.
        proxy_set_header   X-Forwarded-Host $host;
        proxy_read_timeout    90s;
        proxy_connect_timeout 15s;
        proxy_send_timeout    30s;
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
        include /etc/nginx/snippets/tm-security-headers.conf;
    }

    access_log /var/log/nginx/topic-manager-access.log;
    error_log  /var/log/nginx/topic-manager-error.log;
}

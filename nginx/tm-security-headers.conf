# Jarvis Topic Manager — security headers, included in EVERY location of the site.
# NGNX-APP-000850 (v1.3.0, docs/STIG-COMPLIANCE.md): script-src still carries
# 'unsafe-eval' because the Vue runtime compiles the component templates in the
# browser. ACCEPTED RISK until the templates are precompiled, which needs a build
# step this product does not have yet; the plan is to remove it then. Scripts
# still load from this site only ('self'); nothing inline, nothing third-party.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; form-action 'none'; base-uri 'self';" always;

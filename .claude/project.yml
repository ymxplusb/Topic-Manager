contract_version: 1
name: Topic Manager
# AUTHORITATIVE: the GitLab project james.rodman/topic-manager (remote
# `gitlab`). The GitHub repository is a stale public copy; the workflow that
# mirrored it to GitLab and called it authoritative was deleted in v1.1.0.
repo: james.rodman/topic-manager
stack: >-
  Vue 3 global build (no build toolchain, no npm) served static by nginx +
  Python 3.12 / Flask / gunicorn backend behind nginx TLS, SQLite for audit log
  and server-side sessions, LDAPS auth against the directory named in
  config.yaml (no built-in default since v1.1.0), confluent-kafka AdminClient
  against operator-defined Kafka clusters.

# No CODEMAP.md exists in this repo. The tree is small enough (91 tracked files
# as of v1.1.0) to read directly; create one if it grows.
code_map: null

# ── version surfaces ────────────────────────────────────────────────────────
# Every place a version string lives. A release must move ALL of these in one
# cascade. The two surfaces that were MISSED in the v1.0.2 cascade
# (app/components/SettingsTab.js, app/main.js) were caught and corrected in the
# v1.0.3 cascade on 2026-08-30 — see hazards[version-surface-drift].
surfaces:
  - path: VERSION
    note: canonical release version
  - path: tm/VERSION
    note: >-
      read at import by tm/routes.py and served by /api/version and
      /api/health; the upgrade verifies the running service against it. It
      sat at 1.0.6 through tags v1.0.6..v1.0.11 because CI compares only
      VERSION with the tag. Since v1.1.0 tools/check-version-surfaces.sh holds
      it (and every surface below) to VERSION, and runs inside tests/run.sh,
      so the CI test lane enforces it.
  - path: app/components/modals/AboutModal.js
    note: >-
      TWO surfaces in one file: the app version (now 'unknown' until
      /api/version answers — it must never assert a version) AND a full
      dependency table that is a fourth copy of the SBOM. The
      sbom-consistency gate holds the table to requirements.txt.
  - path: app/components/SettingsTab.js
    note: >-
      the ['Version', 'N.N.N', ...] row inside downloadPpsm() (~line 283 as of
      v1.1.0). The rows are single-quoted JS literals — see
      hazards[csv-single-quoted-literals]. Must agree with the static PPSM.csv
      ROW FOR ROW, not just in the version: tools/check-ppsm-consistency.sh
      runs the generator under node and fails on any difference but the
      Generated date.
  - path: app/main.js
    note: >-
      NOT A VERSION SURFACE ANY MORE — do not give it a literal back. It seeds
      the displayed version from ref('unknown') and falls back to
      `d.version || 'unknown'`, so it never asserts a version it has not been
      told by /api/version. That is the durable fix described in
      hazards[hardcoded-version-fallback], landed before v1.0.4. Kept in
      surfaces: so a sweep READS it and confirms the sentinel is still there —
      a future edit that reintroduces a hardcoded literal is a regression, not
      a cascade. Corrected 2026-09-01 (v1.0.4 sweep); the previous note
      described the defect as if it were still present.
  - path: app/components/TopBar.js
    note: >-
      Added 2026-09-01 (v1.0.4). Cache-bust token only: `jarvis-mark.png?v=NNNN`
      at ~line 55. Carries NO product version string. It was introduced in
      commit 0c08d1a and NEVER cascaded — it sat at the v1.0.3 token while
      index.html moved, which is exactly the mixed-cache failure the token
      exists to prevent. app/components/modals/AboutModal.js carries the same
      token on the same image. Every ?v= in the repo MUST move together:
      index.html (14), TopBar.js (1), AboutModal.js (1) = 16 tokens, ONE
      distinct value, derived from VERSION as major*1000+minor*100+patch
      (1.1.0 -> 1100). tools/check-version-surfaces.sh ENFORCES all of it
      since round 8: EXACTLY 16 tokens (EXPECTED_TOKENS; adding or removing
      a cache-busted asset is a deliberate edit of that number), every token
      digits only, one value. (The v1.1.0 brief said 18 tokens; 16 were
      measured.)
  - path: index.html
    note: "cache-bust token ?v=NNNN on every script/style — MUST increment per release"
  - path: docs/INSTALL.md
    note: version header + expected health-check output + offline bundle filenames
  - path: SBOM.md
    note: "software bill of materials — version + full dependency table"
  - path: NOTICES.md
    note: >-
      third-party licence notices. Carries NO product version string — only
      dependency versions, which must match requirements.txt and SBOM.md. The
      v1.0.0 dependency drift was corrected on 2026-08-30; it now lists the
      CVE-clean set. A version cascade normally makes no edit here.
  - path: README.md
    note: >-
      version references + the Upgrading section operators are sent to.
      ALSO carries the Compliance audit-actions list, which is coupled to the
      audit.log_action() call sites in tm/routes.py and must enumerate every
      one of them. Found 2026-09-02 (v1.0.5): the list named 6 of the 10
      actions then in the code — SERVICE_RESTART_THROTTLED, CREATE, DELETE and
      UPDATE_CONFIG were absent, so a compliance reader was given an
      undercount. v1.1.0 listed all 16 (SETTINGS_UPDATE the 16th, round 8). Re-derive the set with the AST, never
      with grep: the action is the THIRD POSITIONAL ARG and sits on the line
      AFTER log_action( at most call sites, so a line-oriented grep sees 6 of
      15 and a multi-line regex truncated CLUSTER_CREATE to "STER_CREATE"
      while still returning a count of 15 — a right total made of a wrong set.
      Both were tried on 2026-09-02 and both were wrong.
      v1.2.0 (WO-0004): the recipe reads EVERY module, not tm/routes.py —
      tm/apply.py and tm/audit_retention.py write actions of their own, and a
      routes.py-only recipe would have undercounted by five. 21 in the DB as
      of v1.2.0, plus AUDIT_WRITE_FAILED (syslog-only). t39 holds README to it.
      Use:
      python3 -c "import ast,glob;print(sorted({n.args[2].value for f in glob.glob('tm/*.py')
      for n in ast.walk(ast.parse(open(f).read())) if isinstance(n,ast.Call)
      and getattr(n.func,'attr',getattr(n.func,'id',''))=='log_action'
      and len(n.args)>2 and isinstance(n.args[2],ast.Constant)}))"
  - path: CHANGELOG.md
    note: new section per release
  - path: TROUBLESHOOTING.md
    note: >-
      Added 2026-08-30 after scout found it obliged-in-fact but undeclared.
      It is keyed to the EXACT output strings of the upgrade script and of
      tm/migrate_clusters.py, and to backup paths, so replacing either obliges
      rewriting it. It was the document most tightly coupled to the change and
      surface-sweep would have skipped it.
      CORRECTED 2026-09-01: the previous note cited "Expected v1.0.0 installed"
      as one of those exact strings. That string exists NOWHERE — not in
      install/upgrade-full.sh and not in TROUBLESHOOTING.md, which states the
      opposite ("version-agnostic — there is no 'expected installed version'
      gate"). It described the DELETED root upgrade.sh. Verify a quoted string
      with grep before pinning a document to it.
      As of v1.0.4 it also carries the polkit / restart-control and Cluster
      Builder failure modes, so it is coupled to
      install/polkit/50-topic-manager.rules and
      systemd/topic-manager-nginx-test.service as well.
  - path: install/README.md
    note: >-
      Added 2026-08-30, same reason. Declares the offline bundle contract that
      prepare-offline.sh and the upgrade script must both satisfy.
  - path: app/styles/main.css
    note: >-
      Added 2026-08-30 (v1.0.3). Header comment "* Version: N.N.N", found STALE
      at 1.0.0 — three releases behind. It was invisible twice over: no
      straggler_sweep globbed *.css, and sonar-project.properties sets
      sonar.exclusions=app/styles/** so no scan ever read it either. The file
      IS cache-busted (main.css?v=NNNN in index.html), so it ships to browsers.
  - path: install.sh
    note: >-
      Added 2026-08-30 (v1.0.3). Header comment "# Version: N.N.N". Undeclared
      until the v1.0.3 sweep found it at 1.0.2.
  - path: prepare-offline.sh
    note: >-
      Added 2026-08-30 (v1.0.3). Header comment "# Version: N.N.N". Undeclared,
      and stale by TWO releases (still 1.0.1) when found. The bundle FILENAME it
      emits is derived from the VERSION file at runtime, not hardcoded — do not
      "fix" that into a literal.
  - path: PPSM.csv
    note: >-
      Added 2026-08-30 (v1.0.3). Row 2 is "Version","N.N.N". This is the static
      twin of the CSV that SettingsTab.js downloadPpsm() generates — the two
      MUST carry the same version or an operator gets two different PPSM
      documents from one release.
  - path: .claude/project.yml
    note: this contract drifts like any other file

# NOT a version surface, deliberately: sonar-project.properties carries
# projectKey/projectName/sources/exclusions/python.version and NO
# sonar.projectVersion. Do not add one during a cascade.
# INFRASTRUCTURE VERSIONS ARE NOT GATED. tools/check-sbom-consistency.sh
# validates only components present in requirements.txt, so the SBOM's
# Infrastructure rows have no source of truth and are skipped by design
# ("if want is None: continue"). The gate was not wrong, it was SILENT — which
# is how nginx read "latest", SQLite read "3.x", and Apache Kafka sat at 3.8.x
# for months while the brokers actually ran 4.2.1, a whole major version out.
# Kafka was also not a component at all: it is not installed on the app host.
# Re-measure these from the deployed host EVERY release and pin the result into
# SBOM.md and app/components/modals/AboutModal.js.
# MEASURED 2026-09-26 on 192.168.202.90 for the v1.1.0 cascade: nginx 1.24.0,
# polkitd 124 (124-2ubuntu1.24.04.4), Python 3.12.3, SQLite 3.45.1, Ubuntu
# 24.04.4 LTS, OpenSSL 3.0.13 — unchanged components, so no SBOM/AboutModal row
# moved. The same host's /etc/nginx/nginx.conf still read
# "ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;" — what v1.1.0 now manages.
# MEASURED 2026-09-02 on 192.168.202.90 for the v1.0.5 cascade: nginx 1.24.0,
# polkitd 124 (124-2ubuntu1.24.04.3), Python 3.12.3, SQLite 3.45.1, Ubuntu
# 24.04.4 LTS. All five unchanged from the v1.0.4 pinning — no SBOM or
# AboutModal edit was owed. "Unchanged" is a measurement result, not a reason
# to skip the measurement next time.
# NOTE the ssh quoting trap: `dpkg-query -W -f='${Version}'` sent through a
# double-quoted ssh command has ${Version} eaten by the LOCAL shell and prints
# the literal "%s". Send it single-quoted with \${Version}, or the gate reads
# as run and measures nothing.
infra_remeasure:
  - "nginx -v"
  - "dpkg-query -W -f='${Version}' polkitd"
  - "/opt/topic-manager/venv/bin/python3 --version"
  - "/opt/topic-manager/venv/bin/python3 -c 'import sqlite3; print(sqlite3.sqlite_version)'"
  - ". /etc/os-release; echo $VERSION    # target-platform line, not a component"

straggler_sweep:
  - "grep -rn '1\\.0\\.[0-9]' --include='*.md' --include='*.js' --include='*.py' --include='*.html' . | grep -v CHANGELOG"
  # The .md/.js/.py/.html sweep above globs no .sh and no .csv, which is why
  # install.sh, prepare-offline.sh and PPSM.csv stayed invisible for two
  # releases. Added 2026-08-30.
  - "grep -rn '1[.]0[.][0-9]' --include='*.sh' --include='*.csv' --include='*.conf' --include='*.service' --include='*.css' --include='*.properties' --include='*.yaml' ."
  # Belt and braces: extension-agnostic. Globs are how surfaces hide — *.css was
  # missing above and app/styles/main.css sat at 1.0.0 for three releases.
  - "grep -rInE '1[.][01][.][0-9]+' . --exclude-dir=.git --exclude-dir=.work --exclude-dir=__pycache__ --exclude=CHANGELOG.md   # then read every hit"
  - "bash tools/check-version-surfaces.sh   # the machine-checked half of this sweep"
  # Expected historical hits that are NOT stragglers: CHANGELOG.md sections,
  # SBOM.md '(moved in 1.x.y)' change-history rows, and deliberate "before
  # v1.0.6" / "since v1.1.0" references describing behaviour history. The
  # docs/SonarQube-Report-*.html artefacts were removed in v1.1.0.

# ── gates ───────────────────────────────────────────────────────────────────
# Every command below was RUN before being written here. CI exists (see ci:):
# on a vX.Y.Z tag it runs `tests/run.sh --strict`, which also runs the
# ppsm-consistency, env-neutral and version-surfaces gates as test cases (t19,
# t21, t22). The syntax/parse gates below are still run by hand. Do not add a
# gate here without running it first and proving it can go red.
gates:
  - name: python-syntax
    cmd: "python -m py_compile tm/*.py install/libexec/tm-apply"
    verified: 2026-08-30
    note: backend compiles; catches the syntax class only
  - name: shell-syntax
    cmd: "for f in *.sh install/*.sh tools/*.sh tests/*.sh tests/lib/*.sh; do bash -n \"$f\" || exit 1; done"
    verified: 2026-08-30
    note: >-
      install.sh, prepare-offline.sh, install/upgrade-full.sh. The root
      upgrade.sh was DELETED on 2026-08-30 (WO-0001, decision E1) — one upgrade
      path in the repo. The glob was CORRECTED on 2026-08-30 to include tools/*.sh —
      gatekeeper confirmed the sca gate's own script was unreachable by the gate
      that checks shell syntax.
  - name: frontend-syntax
    cmd: "bash tools/check-frontend-syntax.sh"
    verified: 2026-09-28
    note: >-
      the ONLY automated guard on the frontend. There is no build step, so a
      syntax error ships straight to the browser as a blank page.
      REG-0017 (v1.2.0): was a fixed glob (app/main.js app/components/*.js
      app/components/modals/*.js), which stayed green when a file index.html
      loads was deleted. The list is now derived from index.html (every
      <script src> and stylesheet, comments excluded), a missing one fails,
      and the old glob is still parsed for unloaded components. t41
      reg0017 holds it (needs node).
  - name: config-example
    cmd: "bash tools/check-config-example.sh"
    verified: 2026-09-26
    note: >-
      ROUND 8: a required key present with no value (`port:`) or an empty
      string fails; it passed.
      Asserts the example carries every section and key the app actually reads,
      and that its secret_key is still a placeholder. REPLACED the old
      `yaml.safe_load(...)` gate, which gatekeeper proved passes on a ZERO-BYTE
      file (safe_load("") returns None, exit 0) and on a config with whole
      sections deleted. That gate proved "parses" and was read as "is valid".
      Proven RED on both mutations.
  - name: heredoc-python
    cmd: "bash tools/check-heredocs.sh"
    verified: 2026-08-30
    note: >-
      Extracts every embedded Python heredoc from install/upgrade-full.sh
      (PYRESOLVE, PYLDAP, PYBACKUP) and compiles each. bash -n does NOT parse
      heredoc bodies — gatekeeper injected `def broken(:::` into PYLDAP and
      bash -n still exited 0. Was prose in gate_verification; now a real gate.
  - name: sbom-consistency
    cmd: "bash tools/check-sbom-consistency.sh"
    verified: 2026-09-28
    note: >-
      ROUND 12 (gatekeeper B2): the lock's entries and versions come from
      tools/lib/lockparse.py (pip's rules), never a column-0 regex; a lock
      the parser refuses is a FAIL. The regex kept a BOM glued to the first
      entry (N03: blinker unseen, its SBOM row edited to 1.8.0 went green)
      and read "pyasn1==0.6\" + ".4 \" as 0.6 (N04: SBOM row 0.6 green,
      pip installs 0.6.4). Both RED in t25.
      ROUND 8: SBOM.md's transitive rows are held to requirements.lock (every
      locked package not in requirements.txt must be visible at the locked
      version); they were read and ignored.
      The same dependency facts live in FOUR places — requirements.txt (the
      source of truth), SBOM.md, NOTICES.md and the About dialog's table in
      app/components/modals/AboutModal.js. Nothing forced them to agree and all
      had drifted: AboutModal still advertised cryptography 44.0.2, the
      five-advisory pin this release removes, so the About dialog would have
      told an operator the app shipped the vulnerable version. Proven RED on a
      drift in each copy. Only reads tables whose second column header is
      literally "Version" — SBOM.md also carries a change-history table headed
      "| Component | Was | Now |" whose second column is the OLD version, and
      reading that as current produced six false failures on the first run.
  - name: sca
    cmd: "bash tools/sca-check.sh"
    verified: 2026-09-28
    requires_network: "api.osv.dev"
    note: >-
      ROUND 11 (gatekeeper N1, TM-RL-002): requirements.lock is read by
      tools/lib/lockparse.py (pip's rules, the lock gate's parser); every
      entry is queried at the version PIP installs (a direct pin is skipped
      only when requirements.txt already queried that same version), and
      the entries handled must equal the parser's count (was: "> 0"). A lock
      the parser refuses is exit 3. Measured live 2026-09-28: real lock 15 of
      15, all clean; X21 lock -> pyasn1 0.4.8 VULNERABLE, exit 1.
      ROUND 8: OSV answers are parsed as JSON and ANY vulns entry is a
      finding, whatever its ID prefix (a prefix allowlist reported unknown
      prefixes CLEAN); a missing or unreadable requirements.lock is exit 3.
      Queries OSV.dev for every == pin in requirements.txt plus the Vue pin in
      install/upgrade-full.sh. Exits 1 on any advisory, 2 if any package could
      not be checked, 3 if OSV is unreachable — it will not report a pass it did
      not earn. Added because builder mutation control M16 put
      cryptography==44.0.2 (five advisories) back into requirements.txt and ALL
      FOUR other gates stayed GREEN: the gate set was blind to the exact hazard
      class this release exists to fix. Proven RED on that same mutation and on
      a loosened (>=) specifier.

  - name: ppsm-consistency
    cmd: "bash tools/check-ppsm-consistency.sh"
    verified: 2026-09-26
    requires: node
    note: >-
      Runs the REAL SettingsTab.downloadPpsm() under node and requires its CSV
      to equal PPSM.csv cell for cell (the Generated date excepted), plus
      coverage (443/80/22 in; 636, Kafka operator-defined, 53, 123, 514/6514
      planned, OCSP/CRL not used; no 389; no site tie). Proven RED on 7
      one-sided drifts (incl. an apostrophe in a JS cell) and 5 consistent
      edits to both copies.
  - name: pipefail-consumers
    cmd: "bash tools/check-pipefail-consumers.sh"
    verified: 2026-09-27
    note: >-
      No early-exit consumer (grep -q/-m/-l/-L, head, awk exit, sed q) at a pipe
      under pipefail, in tests/ AND the product scripts (install.sh,
      install/*.sh, install/libexec/*, prepare-offline.sh) — REG-0004. A shell
      tokenizer (tools/lib/pipelint.py), not a line regex (REG-0008). Proven RED
      on the real install.sh pkg_installed line put back; t00 and t41 hold it.
  - name: env-neutral
    cmd: "bash tools/check-env-neutral.sh   # --bundle <tgz> for an offline bundle"
    verified: 2026-09-26
    note: >-
      ROUND 8: non-UTF-8 files are scanned byte-for-byte (they were skipped);
      IPv6 unique-local and link-local addresses are ties; a FLAT bundle with
      .work/ at its root is refused (lstrip("./") had eaten the dot).
      No site host names, private addresses, account names, CA name or
      workstation paths in the tracked tree (minus .claude/ and .work/, which
      are export-ignored and never ship). In --bundle mode also refuses
      .claude/, .work/, .git/, .github/ or scan reports inside the tarball;
      prepare-offline.sh deletes a bundle that fails it. Red-proofed in t21.
  - name: version-surfaces
    cmd: "bash tools/check-version-surfaces.sh"
    verified: 2026-09-26
    note: >-
      Every surface in surfaces: (incl. tm/VERSION, the PPSM pair, headers,
      README/INSTALL/SBOM, the newest CHANGELOG section) equals VERSION, and
      all 16 ?v= tokens equal the derived token. Its first run reported 13
      stale surfaces against VERSION 1.0.11. Red-proofed in t22 — since
      round 8 also on a REMOVED token and a non-numeric one.
  - name: requirements-lock
    cmd: "bash tools/check-requirements-lock.sh"
    verified: 2026-09-28
    note: >-
      ROUND 9 (gatekeeper B2): with PyPI reachable it (1) runs
      gen-requirements-lock.py --check-set (the resolved name==version set
      must equal the set PIP reads from the lock — round 11, below — and the
      gate checks its verdict line and that its count equals the lock's
      entry count, not just exit 0; the resolver times out at 600 s -> exit 3)
      and (2) fetches https://pypi.org/pypi/<n>/<v>/json
      for every locked release: every lock hash must be one PyPI published for
      that exact release, and ALL published target wheel hashes are required
      (at least one per package): cp312 or cp3x abi3 (x <= 12) manylinux
      x86_64 with glibc <= 2.39 (Ubuntu 24.04), or py3-none-any. This catches
      a dropped cffi target hash even when another remains. Non-target hashes
      are optional, so new non-target wheels cannot false-red. A newly added
      TARGET wheel deliberately requires regeneration; fixed releases rarely
      add these. gen-requirements-lock.py --check delegates to this same gate.
      OFFLINE IS EXIT 3 ("could not verify")
      unless TM_LOCK_OFFLINE_OK=1 explicitly accepts a structure-only result
      (t25 sets it only for structure fixtures); the verdict and the exit code
      agree. t25 drives the online branch with a fake PyPI (stand-in curl):
      a dropped target hash and one changed hex digit go RED, a dropped
      non-target hash and a newly published non-target wheel stay GREEN. ROUND 8:
      offline it had printed "NOT verified" and exited 0.
      ROUND 10 (gatekeeper B1): ONE parse of the lock, pip's rules
      (backslash continuations, a "#" at line start or after whitespace is a
      comment). The structure check's accepted entries are the list the PyPI
      fetch and the hash check use; the hash check must judge EXACTLY that
      many entries or it FAILS. Round 9 had a second parser that skipped a line
      ending in "# comment": a bad hash there passed as "PASS — 14 releases" on
      a 15-entry lock while pip still honoured it. t25 covers a commented bad
      hash (blinker one-line; cffi's last --hash line) RED, commented good GREEN.
      ROUND 11 (gatekeeper N1): tools/lib/lockparse.py is the ONLY parser of
      requirements.lock, by pip's req_file rules (continuations, comments,
      split on SPACE only, so a TAB before --hash is refused as pip refuses
      it). The gate, gen-requirements-lock.py (--check-set/lock_set) and
      sca-check.sh all import or run it; none keeps a regex of its own.
      Round 10's --check-set and SCA matched raw column-0 lines: X20 (a
      comment ending in a backslash hid cffi from pip and the gate, while
      --check-set still counted it) passed as "PASS — 14 releases"; X21 (the
      real pyasn1==0.6.4 swallowed, an indented pyasn1==0.4.8 below) passed
      the gate and SCA said "pyasn1 0.6.4 CLEAN" while pip installed 0.4.8.
      The gate also refuses a lock whose column-0 view differs from pip's (an
      entry-shaped line pip does not read, an indented entry, a CR/FF/Unicode
      line break), so the remaining column-0 readers (check-sbom-consistency,
      upgrade-full.sh's pin grep) see what pip sees on any lock that passes
      [FALSE — see ROUND 12 below].
      SCA queries every lock entry at the version pip installs and its
      handled count must equal the parser's. t25 compares lockparse with
      pip's own parser (pip._internal.req.req_file) on nine lock shapes.
      ROUND 12 (gatekeeper B1/B2): the round-11 claim above that the
      column-0 readers "see what pip sees" was FALSE for two reasons. (1)
      pip does not decode the lock as UTF-8: a BOM, else a PEP 263 coding
      line in the first two lines, else the locale (auto_decode). N01
      ("coding: latin-1" + U+0145, whose 0x85 byte is NEL) and N02 ("coding:
      utf-7" + ASCII "+AAo-") made pip read a hidden pyasn1==0.4.8 entry:
      gate PASS 15, SBOM green, SCA "0.6.4 CLEAN", pip installed 0.4.8. The
      lock must now be PURE ASCII: every byte < 0x80, no BOM, no coding
      declaration in lines 1-2, no line break but LF (CRLF tolerated), no
      control character but TAB. lockparse.read() refuses anything else, so
      the gate, --check-set, SCA and the SBOM check all refuse it; the
      generator writes only ASCII (its header's em dash is now "-") and
      refuses to write a lock these rules would refuse. (2) check-sbom-
      consistency.sh kept its own column-0 regex (see sbom-consistency) and
      now uses the parser. The gate also refuses an entry whose name==version
      is not whole on its first line (N04). upgrade-full.sh's direct-pin grep
      stays a column-0 grep: it only confirms the seven direct pins and fails
      CLOSED on any lock it cannot match, and it runs on an air-gapped host
      from a tree whose lock has already passed this gate (prepare-offline.sh
      runs it); moving it onto the parser would make the installer depend on
      tools/lib/ being in the bundle for no change in what pip installs.
      t25: N01-N04 plus BOM, UTF-16, raw 0x85/0x0b/0x0c/0x00/U+2028 and a
      coding line on line 2 are RED on the gate and on the SBOM check; the
      pip oracle reads the fixtures' raw bytes.
      WHERE THE REAL LOCK IS CHECKED AGAINST LIVE PyPI IN v1.1.0 (James,
      round 10): only (a) prepare-offline.sh, which runs this gate and dies on
      any non-zero exit (prepare-offline.sh:63), and (b) running this gate by
      hand. CI does NOT: v1.1.0's .gitlab-ci.yml runs tests/run.sh --strict
      only, where t25 checks the REAL lock structure-only (curl stubbed,
      TM_LOCK_OFFLINE_OK=1) and drives the online logic against a FAKE PyPI
      built from the lock's own hashes. v1.2.0 adds a --require-online CI step
      (REG-0007). Measured 2026-09-28 by hand, live PyPI: PASS, 15 releases.
      requirements.lock (tools/gen-requirements-lock.py) pins every Python
      package incl. transitive ones with the sha256 of every published wheel;
      every installer uses it with --require-hashes --only-binary :all:. The
      gate holds it to requirements.txt and refuses unhashed/malformed/duplicate
      entries. After changing a pin: regenerate, commit, re-run sca (which now
      queries the transitive pins too). Red-proofed in t25.
  # v1.2.0 (REG-0005..0013): sca queries every LOCKED version; requirements-lock
  # checks a self-consistent closure and CI runs it with --require-online
  # (merged with round 9: --require-online refuses offline even under
  # TM_LOCK_OFFLINE_OK=1; t25 asserts both flag values, t41 asserts exit 1);
  # version-surfaces scans every app/ JS with comments stripped; sbom holds the
  # About dialog's infrastructure rows to SBOM.md. Reproductions in t41.
  - { name: repo-tests, cmd: "bash tests/run.sh", verified: 2026-09-26, note: "t00-t27 (28 files). Round 8 (gatekeeper): the runner refuses zero files, a default set that is not every tests/t*.sh, a file that reports no case, and an unknown requirement (all exit 2); --strict counts its OWN tally (TM_RESULTS_OUT is only a copy); no `| grep -q` / `| grep -m` / `| head` / awk-exit consumer at the end of a pipe in tests/ (tools/check-pipefail-consumers.sh, run by t00) after a SIGPIPE race false-failed t24 in 2 of 3 fresh remote runs. Round 2, 2026-09-26: Linux host via --remote --strict (ships git archive HEAD) 210+ pass / 0 fail, only the 'needs node' cases skip (node absent there; the workstation run covers them). Mutation controls M01-M107 (tests/mutate.sh --remote): all killed except 4 documented equivalents. Round 3, 2026-09-26 (offline apt policy): --remote --strict 229 pass / 0 fail / 20 skip (all needs node); M01-M142 --remote: 136 killed, 0 survived, 6 documented equivalents (M14, M45, M87, M103, M141, M142). Round 4: --remote --strict and M01-M167, see WO-0003 builder.round4. t23's real-apt cases need the 'apt' requirement and its prompt cases 'pty' (both Linux only; they SKIP on the workstation). Workstation-only artefact: t12's route case can fail under Git Bash (MSYS path conversion); passes on Linux and CI." }

gate_verification:
  - "A gate must assert its own COVERAGE, not just agreement. Guarding on
     'found nothing' catches total parse failure and is blind to PARTIAL
     loss. Measured 2026-09-01: a blank line mid-table dropped
     check-sbom-consistency from 12 components to 8, and a renamed header
     to 5, while it printed 'all 3 copies agree' both times. It now
     requires every == pin in requirements.txt to be VISIBLE in each copy."
  - "A gate that cannot fail is not a gate. Before trusting a green run, break
     one file deliberately and confirm the gate goes red."
  - "python -m py_compile writes __pycache__ — confirm it is gitignored (it is)."
  - "node --check must be run per-file; it does not recurse."
  - "bash -n does NOT parse heredoc bodies. upgrade-full.sh embeds Python
     heredocs (PYRESOLVE, PYLDAP, PYBACKUP); a syntax error inside one ships
     untested. Extract each heredoc and py_compile it separately."
  - "The eight declared gates (5 syntax/consistency + sca + the repo test suite) cannot see a vulnerable dependency pin, a broken
     offline bundle, or a fail-open blocker check. Only the sca gate covers the
     first. The other two are covered by nothing automated — review them."
  - "Never compare hashes of possibly-empty command output. sha256sum emits a
     digest for empty input, so two failed commands both hash to
     e3b0c44298fc1c... and compare EQUAL. Compare the raw values and require
     each to be well-formed. This produced a false 'cert/key match verified' in
     upgrade-full.sh, found 2026-08-30."

accepted_test_failures: {}   # none. (t12's route case fails ONLY under Git Bash with a local venv — a path-conversion artefact, see gates[repo-tests]; it is not accepted on Linux/CI)


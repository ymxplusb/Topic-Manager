# ── render proof ────────────────────────────────────────────────────────────
render_proof:
  applicable: true
  local_dev_server: none
  note: >-
    There is no build toolchain and no local dev server. The only way to prove a
    frontend change renders is against a running host. Use the prod URL below
    read-only, or stand up a scratch VM — do NOT use cortex-2, which belongs to
    CORTEX /qc.
  url: "https://192.168.202.90/"
  checks:
    - "the app shell mounts (#app-mount is populated, not empty)"
    - "no Uncaught SyntaxError / ReferenceError in the console"
    - "security headers present on / and on *.js — see hazards[1]"

# ── release ─────────────────────────────────────────────────────────────────
release:
  push_policy: >-
    Work lands on a release/vX.Y.Z branch and is MERGED to main on GitLab (the
    authoritative remote). Do not commit release changes directly to main.
  tag: "vX.Y.Z on GitLab"
  note: >-
    Tags v1.0.6..v1.0.11 exist. A vX.Y.Z tag runs the ci-templates pipeline
    (.gitlab-ci.yml, pinned v1.5.3): VERSION == tag, shellcheck, CR check,
    data-file parse, tests/run.sh --strict, Sonar, then a git-archive tarball
    and its checksum published to the project's package registry. Nothing is
    deployed. .gitattributes export-ignores .claude/, .work/ and .github/, so
    neither the published tarball nor the offline bundle carries them.
  cascade: "bump every entry in surfaces: in ONE commit, including the index.html ?v= token"

ci:
  github_actions: none        # .github/workflows/main.yml (a GitHub->GitLab mirror) deleted in v1.1.0
  gitlab: ".gitlab-ci.yml -> james.rodman/ci-templates v1.5.3, on vX.Y.Z tags"
  status: >-
    CI runs on TAGS only. Never report "CI passed" for a branch or a commit
    that has not been tagged and whose pipeline you have not read; report
    exactly which gates you ran by hand.


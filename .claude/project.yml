# ── hazards ─────────────────────────────────────────────────────────────────
# Learned, not imagined. Each one has actually happened in this codebase.
hazards:
  - id: any-request-renews-the-session
    note: >-
      FOUND 2026-09-02 (v1.0.6), and it is the reason a timeout NUMBER is not a
      timeout. `require_auth` called `touch_session(db, sid, _timeout())` on
      EVERY authenticated request, and TopicsTab and ConsumerGroupsTab each
      auto-refresh every 30 seconds. So an open tab pushed its own `expires_at`
      a further full timeout into the future twice a minute, for as long as the
      browser stayed open: the idle timeout could only ever expire a tab that
      was ALREADY CLOSED, and lowering `session.timeout_minutes` from 30 to 15
      would not have changed that by one second. The rule now is that a request
      carrying `X-TM-Background: 1` is not activity, and the two auto-refresh
      call sites send it. Trusting the client is safe IN THIS DIRECTION ONLY -
      the header can shorten a session and never lengthen one - so a caller that
      forgets it merely gets the old behaviour and one that forges it expires
      itself sooner. THE GENERAL SHAPE, worth carrying to any other product
      here: a sliding-window session plus ANY background poll is a session that
      never expires, and the polling is usually somewhere nobody thinks of as
      auth code. tests/t14-idle-session.sh pins it, with a mutation control that
      removes the guard and requires the real check to go red.
  - id: version-surface-drift
    note: >-
      In the v1.0.2 release, app/components/SettingsTab.js and app/main.js were
      left reading '1.0.0' and NOTICES.md kept the v1.0.0 dependency set while
      SBOM.md had moved on. All were corrected in the v1.0.3 cascade
      (2026-08-30). Updating twelve of thirteen surfaces is the normal failure
      here — sweep with straggler_sweep, do not eyeball it. The v1.0.3 sweep
      also found THREE version surfaces the contract never declared
      (install.sh, prepare-offline.sh, PPSM.csv); prepare-offline.sh had been
      stale for two releases. An undeclared surface is invisible to a cascade —
      when you find one, add it to surfaces: in the same pass.

  - id: csv-single-quoted-literals
    note: >-
      app/components/SettingsTab.js downloadPpsm() builds CSV rows from arrays of
      SINGLE-QUOTED JavaScript string literals. One literal apostrophe inside any
      of those strings terminates the literal and takes the whole Settings tab
      down as a parse error — there is no build step, so it ships straight to the
      browser as a blank pane. Write "do not", never "don't", and rephrase
      possessives. node --check is the only thing that catches it.

  - id: hardcoded-version-fallback
    note: >-
      RESOLVED 2026-08-31, kept as a rule. app/main.js and AboutModal.js
      both used to seed a hardcoded version literal, so a host that could
      not reach /api/version displayed a confident WRONG number — this app
      showed 1.0.2 while running 1.0.0 for three months. Both now seed
      'unknown' (main.js:19,24; AboutModal data()). THE RULE: a fallback
      must degrade to unknown, never assert a version. Do not let a
      version cascade put a literal back — surface-sweep is told this too.

  - id: nginx-add-header-inheritance
    note: >-
      nginx discards ALL inherited add_header directives the moment a child
      location declares its own. `location /` and `location ~* \.(js|css)$` both
      set Cache-Control, which silently drops every server-level security header
      on the entire HTML/JS/CSS surface. Only /api/* keeps them. This regressed
      once already. Every location MUST include snippets/tm-security-headers.conf,
      and the fix must be verified by `curl -skI` per route class — reading the
      config file proves nothing.

  - id: ldap-service-bind-upgrade-trap
    note: >-
      v1.0.0's auth.py has NO service-bind logic — it binds directly as the user,
      so a wrong ldap_bind_dn in config.yaml is simply ignored and every login
      works. v1.0.2+ treats a configured bind_dn + non-placeholder password as
      "use the service bind" and gates EVERY login on it succeeding (auth.py:44,
      returns at :46). A stale DN that was harmless for months becomes a total
      auth outage the moment the new code starts — while health, version and the
      UI all still look green. Verified failing on prod 2026-08-30.
      install/upgrade-full.sh blocks on this.

  - id: vulnerable-pin-in-requirements
    note: >-
      RESOLVED (cryptography 50.0.1 since v1.0.3; tools/sca-check.sh 8/8 clean
      2026-09-26). Kept as the rule: re-run SCA against requirements.txt.
      HISTORY: requirements.txt pinned cryptography==44.0.2, which carries five advisories
      (CVE-2026-69247/-69248/-69249, CVE-2026-26007, CVE-2026-34073; fixed in
      50.0.0). Deploying v1.0.2 exactly as released does NOT clear them. Re-run
      SCA against requirements.txt, not just against what is installed.

  - id: vue-fetched-without-integrity
    note: >-
      RESOLVED. install.sh (since v1.0.4), prepare-offline.sh and
      install/upgrade-full.sh all verify VUE_SHA256; the v1.1.0 pin (3.5.43,
      b7239405...478e) was verified against the npm registry tarball, not the
      CDN alone. The text below is history, including the "STILL LIVE for
      install.sh" line, which stopped being true in v1.0.4.
      HISTORY: install.sh and upgrade.sh curl vue.global.prod.js from jsDelivr and serve
      whatever comes back — no SRI, no checksum, no signature. Pin by content
      hash. install/upgrade-full.sh does; the older scripts do not.
      STILL LIVE for install.sh, which asks for 3.5.35 and takes whatever comes
      back. upgrade.sh was deleted 2026-08-30, so it is no longer a route; the
      fresh-install route is unfixed and is recorded in SBOM.md as a known
      divergence (upgraded hosts run a verified 3.5.42, fresh installs do not).

  - id: stig-umask-403
    note: >-
      On a STIG-hardened host (umask 077) deployed frontend assets land 0700 and
      www-data cannot read them — nginx returns 403 on every page while the
      service itself looks healthy. Check effective access as the real principal
      (`sudo -u www-data test -r <file>`), not mode bits.

  - id: sqlite3-cli-absent
    note: >-
      The sqlite3 CLI is NOT installed on stock Ubuntu Server 24.04. Any script
      guarded by `command -v sqlite3` will skip silently. Use python3's stdlib
      sqlite3 module instead.

  - id: misleading-failure-message
    note: >-
      upgrade.sh's die() always prints "System is unchanged — your v1.0.0 install
      is still running", including after Phase 4 has deleted the venv, app code,
      frontend, nginx config and systemd unit. Never write a failure message that
      asserts a state the code path cannot guarantee.
      That script was deleted 2026-08-30; the lesson stands and is the reason
      install/upgrade-full.sh tracks DESTRUCTIVE_STARTED and RESTORE_POINT_READY
      rather than asserting a state from a fixed string.

  - id: windows-clone-crlf
    note: >-
      This repo is cloned on Windows. Git's autocrlf makes EVERY file differ from
      a Linux checkout byte-for-byte. Any live-vs-repo comparison must normalise
      line endings (`tr -d '\r'`) or it will report all files as changed.

  - id: secret-key-fail-open
    note: >-
      v1.0.0's app.py used `secret_key or secrets.token_hex(32)` — with 4 gunicorn
      workers each generates a DIFFERENT signing key, so sessions are valid on one
      worker and rejected on the next. v1.0.2+ raises RuntimeError instead. Check
      the key is really set before upgrading.

  - id: no-ci-no-tests
    note: >-
      SUPERSEDED: CI on tags and a test suite (t00-t27) now exist. What
      remains true: nothing renders the frontend or runs install.sh on a clean
      host automatically — render proof and a from-scratch install are still
      manual, and the Linux-only mode cases need --remote.

  - id: tm-version-drift-under-ci-tags
    note: >-
      FOUND 2026-09-26 (v1.1.0). CI compares VERSION with the tag and nothing
      else, so tm/VERSION (what /api/health serves) stayed 1.0.6 through six
      tagged releases and prod's health answer could not say which was
      installed. tools/check-version-surfaces.sh (t22) now holds every
      surface to VERSION inside the test lane.

  - id: ldap-defaults-removed
    note: >-
      v1.1.0 removed tm/auth.py's built-in ldap_server / ldap_base_dn /
      ldap_domain defaults (they named one site's directory). A config.yaml
      that relied on them locks every user out on the new code, so the
      upgrade BLOCKS on missing keys and --force does NOT override that one;
      install.sh refuses a reinstall over such a config BEFORE copying code.

  - id: bundle-was-the-working-directory
    note: >-
      Until v1.1.0 prepare-offline.sh tarred the whole checkout, shipping
      .claude/, .work/ (production addresses), scan reports and untracked
      files. It now uses git archive of HEAD with .gitattributes
      export-ignore — which must name the directory AND its /** contents, or
      git archive still emits the empty directories (measured) — and
      tools/check-env-neutral.sh --bundle deletes a leaky bundle.

  - id: offline-bundle-is-a-repository
    note: >-
      MEASURED 2026-09-26 on a real STIG (USG) + FIPS Ubuntu 24.04.4 host: the
      bundle's .deb closure includes every alternative provider, and handing
      apt the raw list failed ("pkgProblemResolver::Resolve generated breaks").
      The bundle is now an indexed apt repository used through a private,
      --no-download apt config, asking only for missing top-level packages.
      Never go back to passing .deb paths to apt/dpkg (t23 asserts it).
      ROUND 3, MEASURED on the same host: priority 1 (below every installed
      package) meant apt could never upgrade a dependency, and
      python3.12-venv (= python3.12 0ubuntu0.17) failed against an installed
      0ubuntu0.13 — an air-gapped host always lags. The policy is NEVER
      DOWNGRADE, NEVER REPLACE A FIPS PACKAGE, UPGRADE WHAT A DEPENDENCY NEEDS:
      bundle at 500 (never >= 1000, which permits a downgrade), a -1 bundle
      pin for every installed package whose version matches /fips/i or whose
      installed origin is esm.ubuntu.com/fips*, host preferences.d excluded,
      --no-remove, and the plan simulated and printed before it runs. t23
      runs the REAL resolver against a fixture dpkg status (Linux only).
      ROUND 4, MEASURED on the same host: the policy held (29 FIPS packages)
      but apt could only upgrade python3.12 by REMOVING libpython3.12t64 —
      binaries of one Debian source move in lockstep and the bundle carried
      the REQUEST closure only. prepare-offline.sh adds every binary of the
      same source + source version (arch + all, no dbg/doc, <= 40 per source)
      and install.sh names missing siblings in a removal refusal. t26 proves
      it with real .debs, a real bundle build and the real resolver.

  - id: online-clone-must-be-pinned
    note: >-
      Root runs what the online upgrade clones. A branch or tag is movable, so
      --repo-commit <40-hex> is mandatory with --repo-url and HEAD is compared
      with it before any byte of the tree is read (t20). Signed-tag
      verification is a follow-up.

  - id: agent-heredoc-backslashes
    note: >-
      MEASURED 2026-09-26 while building v1.1.0: in the agent's Bash tool a
      `\\` in a quoted heredoc sometimes arrives as `\`, turning
      `printf '...\n'` into a literal newline and `\` + newline into a line
      continuation; the Write tool turns `\u0027` into a bare apostrophe (which
      blanked SettingsTab until node --check caught it). Put backslash-bearing
      edit specs in files written with the Write tool, avoid \u escapes, and
      verify every such edit with bash -n / node --check / py_compile.


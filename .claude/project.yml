# ── principles ──────────────────────────────────────────────────────────────
principles:
  - "Never assume the repo version is the deployed version — check
     /api/health first, every time. This principle used to assert 'Prod is on
     1.0.0'; measured 2026-09-01 prod answers 1.0.3, so the principle had
     itself become the stale version claim it warns about. State the check,
     not a remembered number."
  - "This repo has no CI. It DOES have a test suite (tests/, 120 cases) as of 2026-09-01. Never report that CI passed or that tests
     are green; say exactly which of the eight declared gates (5 syntax/consistency + sca + the repo test suite) ran."
  - "Every authenticated user is a Kafka admin by design. There is no role
     separation — 'authenticated' and 'can delete any topic' are the same thing."
  - "Security headers must be proven SERVED per route class with curl -skI.
     Reading the nginx config is not evidence."
  - "Effective access is asked of the kernel as the real principal, never
     inferred from mode bits."
  - "Topic create/delete reaches the production Jarvis Kafka cluster. Treat every
     write path as production-affecting."
  - "No agent holds a deploy verb for this project. Deployment is operator-run."

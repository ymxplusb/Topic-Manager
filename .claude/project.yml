# ── principles ──────────────────────────────────────────────────────────────
principles:
  - "Never assume the repo version is the deployed version — check
     /api/health first, every time. This principle has now gone stale TWICE by
     baking in the answer: it asserted 'Prod is on 1.0.0', was corrected on
     2026-09-01 to 'prod answers 1.0.3', and on 2026-09-02 prod answered 1.0.4.
     A principle that carries a number is a principle with a shelf life. The
     number lives in promote.prod.running_version and NOWHERE else; this
     principle states only the check: curl -sk https://192.168.202.90/api/health"
  - "CI runs on tags only (ci-templates); the test suite is tests/ (t00-t27, 28 files). Never report that CI passed or that tests
     are green without saying exactly which declared gates ran, where (workstation, --remote Linux host, CI) and what skipped."
  - "Every authenticated user is a Kafka admin by design. There is no role
     separation — 'authenticated' and 'can delete any topic' are the same thing."
  - "Security headers must be proven SERVED per route class with curl -skI.
     Reading the nginx config is not evidence."
  - "Effective access is asked of the kernel as the real principal, never
     inferred from mode bits."
  - "Topic create/delete reaches the production Jarvis Kafka cluster. Treat every
     write path as production-affecting."
  - "No agent holds a deploy verb for this project. Deployment is operator-run."

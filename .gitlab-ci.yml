# The release pipeline for this project lives in james.rodman/ci-templates and
# is shared across this estate. This file names the version of it that runs
# here.
#
# On a vX.Y.Z tag: check that VERSION agrees with the tag, lint every shell
# script, refuse a carriage return in one, parse the data files, build a tarball
# with `git archive` from the tag object, publish it and its checksum to this
# project's package registry, and cut a release. Nothing is deployed.
#
# THE REF IS A TAG ON PURPOSE. With `ref: main` the shared file could change
# under this repository between two of its own releases, and a pipeline that
# passed last month would fail with nothing in this repository's diff to explain
# it. Moving to a newer template is a commit here, reviewable like any other.
include:
  - project: james.rodman/ci-templates
    ref: v1.5.3
    file: /templates/build-test-publish.yml

variables:
  # THE TEST LANE IS ON, AND THE COMMANDS BELOW WERE MEASURED, NOT GUESSED.
  # MEASURED in the job image on 2026-09-08, pipeline 71: 128 passed, 0 failed,
  # 0 SKIPPED, exit 0. --strict is deliberate and the harness's own header asks
  # for it on CI: a SKIP becomes a failure. Without the three setup pieces the
  # same run skipped 21 cases and exited 2 - sudo for the permission-model and
  # baseline cases, nodejs for the settings-banner frontend probes, and the
  # python deps so tm.app imports for the proxy-header and throttle cases.
  # A suite that skips a fifth of itself and reports green is not a test lane.
  #
  # An empty TEST_COMMAND would mean the job is ABSENT from the pipeline
  # rather than present and skipping. Its exit code is the job verdict; the
  # publish job waits on it.
  TEST_SETUP: "apt-get update -qq && apt-get install -y -qq --no-install-recommends sudo nodejs jq curl nginx && pip install --quiet -r requirements.txt"
  # REG-0007 (v1.2.0): the lock's completeness is verified ONLINE at release
  # time. The test lane stubs the network for it (t25), so the gate runs here
  # first with --require-online: offline, or with a closure it cannot verify,
  # the tag does not publish.
  TEST_COMMAND: "bash tools/check-requirements-lock.sh --require-online && bash tests/run.sh --strict"

  # No SonarQube here yet: this project has no SONAR_TOKEN or SONAR_HOST_URL CI
  # variable, and the template's scan job exits 2 - could not run, which is not
  # a pass - rather than pretending. An empty key means the job is absent.
  # Turned on 2026-09-09. This was "" and an empty value does not skip the scan
  # job - it stops GitLab CREATING it, so the tag pipeline went green having
  # scanned nothing. There was no exit code to read.
  #
  # Vue 3 + Flask. Full language analysis; last scanned 2026-05-29 by hand.
  #
  # SONAR_TOKEN and SONAR_HOST_URL are project CI variables. The project key is
  # not a secret and belongs where a reviewer can see it.
  SONAR_PROJECT_KEY: "topic-manager"
